name: Keep-alive

# Giữ ấm serverless function trên Vercel và chống Supabase free tier tự pause
# (Supabase pause project sau 7 ngày không có query).
#
# ---------------------------------------------------------------------------
# ĐANG TẮT LỊCH CHẠY — dự án Vercel đang pause (2026-08-13).
#
# Site tắt thì mọi lần ping đều fail, và GitHub gửi mail báo hỏng sau mỗi lần
# workflow theo lịch thất bại. Bỏ khối schedule đi là hết mail.
#
# Bật lại khi chạy site: bỏ dấu # ở hai dòng schedule bên dưới rồi push.
#   schedule:
#     - cron: "*/5 * * * *"
# Lambda Vercel ngủ sau ~10-15 phút vắng request nên 5 phút/lần là đủ; đó cũng
# là chu kỳ nhỏ nhất GitHub Actions cho phép.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch: # chỉ chạy khi bấm tay, không tự chạy theo lịch nữa

# Nếu lần chạy trước còn treo thì huỷ, tránh chồng job.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping site
        run: |
          for url in "https://mttq.vercel.app/" "https://mttq.vercel.app/api/ping"; do
            code=$(curl -sS -o /dev/null -w '%{http_code} %{time_starttransfer}s' \
                        --max-time 30 --retry 2 --retry-delay 5 \
                        -H 'Cache-Control: no-cache' \
                        -H 'User-Agent: mttq-keepalive/1.0 (github-actions)' \
                        "$url") || { echo "FAIL $url"; exit 1; }
            echo "$code  $url"
          done
